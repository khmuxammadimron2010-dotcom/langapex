<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LangApex Academy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">LangApex Academy</div>
</header>

<section class="application">
    <h2>School Application Form</h2>

    <form id="applyForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullname" required>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Home Address</label>
            <input type="text" id="address" required>
        </div>

        <div class="form-group">
            <label>Grade Applying For</label>
            <select id="grade" required>
                <option value="">Select Grade</option>
                <option>Primary (1–4)</option>
                <option>Middle (5–9)</option>
                <option>High School (10–11)</option>
            </select>
        </div>

        <button type="submit">Submit Application</button>
    </form>

    <!-- Confirmation Section -->
    <div id="confirmation" style="display:none;">
        <h3>Please Confirm Your Information</h3>
        <p id="confirmText"></p>
        <button onclick="finalSubmit()">Confirm Registration</button>
    </div>

    <!-- Success Message -->
    <div id="successMessage" style="display:none;">
        <h2>🎉 Congratulations!</h2>
        <p>You have successfully registered to LangApex Academy.</p>
    </div>

</section>

<script>
document.getElementById("applyForm").addEventListener("submit", function(e){
    e.preventDefault();

    let name = document.getElementById("fullname").value;
    let dob = document.getElementById("dob").value;
    let phone = document.getElementById("phone").value;
    let email = document.getElementById("email").value;
    let address = document.getElementById("address").value;
    let grade = document.getElementById("grade").value;

    let confirmText = `
        <strong>Full Name:</strong> ${name} <br>
        <strong>Date of Birth:</strong> ${dob} <br>
        <strong>Phone:</strong> ${phone} <br>
        <strong>Email:</strong> ${email} <br>
        <strong>Address:</strong> ${address} <br>
        <strong>Grade:</strong> ${grade}
    `;

    document.getElementById("confirmText").innerHTML = confirmText;

    document.getElementById("applyForm").style.display = "none";
    document.getElementById("confirmation").style.display = "block";
});

function finalSubmit(){
    document.getElementById("confirmation").style.display = "none";
    document.getElementById("successMessage").style.display = "block";
}
</script>

</body>
</html>
